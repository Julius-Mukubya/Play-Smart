<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Smart — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page-wrap" style="flex-direction:column; align-items:center;">
  <div class="screen-label-bar">
    <a href="index.html">← All screens</a>
    <h2>Sign In</h2>
  </div>
  <div class="phone-shell">
    <div class="phone-notch"></div>
    <div class="app-bar">
      <button class="app-bar-back">←</button>
      <span class="app-bar-title">Sign In</span>
    </div>
    <div class="phone-screen">
      <div class="screen-content p-24">

        <!-- Brand -->
        <div style="text-align:center;padding:32px 0 40px;">
          <div style="font-size:56px;margin-bottom:12px;">⚽</div>
          <h2 style="font-size:22px;font-weight:700;margin:0 0 4px;">Welcome back</h2>
          <p style="font-size:13px;color:var(--text-muted);margin:0;">Sign in to continue</p>
        </div>

        <!-- Fields -->
        <div class="input-group">
          <div class="input-wrap">
            <span class="input-icon">✉️</span>
            <input class="input-field" type="email" placeholder="Email">
          </div>
        </div>
        <div class="input-group" style="margin-bottom:4px;">
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input class="input-field" type="password" placeholder="Password">
          </div>
        </div>

        <!-- Forgot password -->
        <div style="text-align:right;margin-bottom:24px;">
          <button class="btn-ghost" style="font-size:12px;color:var(--accent-primary);">Forgot password?</button>
        </div>

        <button class="btn btn-primary btn-full mb-16">Sign In</button>

        <div style="display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;">
          <span class="text-muted">Don't have an account?</span>
          <a href="sign-up.html" class="btn-ghost" style="padding:0;">Sign Up</a>
        </div>

      </div>
    </div>
  </div>
</div>
</body>
</html>
