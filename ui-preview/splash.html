<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Smart — Splash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page-wrap" style="flex-direction:column; align-items:center;">
  <div class="screen-label-bar">
    <a href="index.html">← All screens</a>
    <h2>Splash Screen</h2>
  </div>
  <div class="phone-shell">
    <div class="phone-notch"></div>
    <div class="phone-screen" style="align-items:center; justify-content:center; background:var(--bg-surface);">
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
        <div style="font-size:72px;line-height:1;">⚽</div>
        <div style="font-size:30px;font-weight:700;letter-spacing:-0.5px;">Play Smart</div>
        <div style="margin-top:24px;">
          <!-- Circular progress indicator -->
          <div style="width:32px;height:32px;border:3px solid var(--bg-surface-alt);border-top-color:var(--accent-primary);border-radius:50%;animation:spin 0.9s linear infinite;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</body>
</html>
